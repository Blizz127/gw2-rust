[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
gw2-api = { path = "crates/gw2-api" }
gw2-dat = { path = "crates/gw2-dat" }
gw2-net = { path = "crates/gw2-net" }
gw2-proto = { path = "crates/gw2-proto" }

anyhow = "1"
bytes = "1"
lz4_flex = "0.14"
quick-xml = "0.39"
rc4 = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = { version = "0.7", features = ["codec"] }
ureq = "3"
